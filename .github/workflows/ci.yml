name: CI

# Kit template. Fill every "FILL:" step for the project's stack, keep the shape:
# - gitleaks (light, GitHub-hosted) classifies the changed files and scans for secrets on every event.
# - Heavy jobs run on HEAVY_RUNNER (a self-hosted runner) for same-repo PRs, GitHub-hosted otherwise.
# - Heavy jobs run only on pull requests (main already passed them on the PR head) and only when the
#   classifier did not say 'false' for them; e2e also skips draft PRs.
# - Every job has timeout-minutes (the agent token cannot cancel runs).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.classify.outputs.app }}
      python: ${{ steps.classify.outputs.python }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        run: python3 scripts/ci_changes.py
      - name: Forbidden files (another program's files, binaries, keys)
        run: python3 scripts/check_forbidden_files.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gitleaks.outputs.app != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HEAVY_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # FILL: set up the toolchain the same way on both runners, for example:
      # - uses: actions/setup-node@v4
      #   with: { node-version-file: .nvmrc, cache: npm }
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: "25", cache: maven }
      - name: Build and test
        run: echo "FILL: install from the lockfile, lint, test, build" && exit 1

  python:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gitleaks.outputs.python != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HEAVY_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script tests
        run: python -m unittest discover -s scripts -v

  e2e:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.gitleaks.outputs.e2e != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HEAVY_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # FILL: toolchain, browsers (install system deps only when runner.environment == 'github-hosted'),
      # start servers, run end-to-end tests.
      - name: End-to-end tests
        run: echo "FILL: end-to-end tests, or delete this job and 'e2e' from scripts/ci_paths.json" && exit 1
      - name: Stop servers
        if: always()
        run: python3 scripts/stop_all.py
