name: CI

# - gitleaks (light, GitHub-hosted) classifies the changed files and scans for secrets on every event.
# - Heavy jobs run only on pull requests (main already passed them on the PR head) and only when the
#   classifier did not say 'false' for them.
# - app and python use the HEAVY_RUNNER expression in runs-on; the variable stays unset, so they run
#   on GitHub-hosted runners. app-windows runs on windows-latest. No self-hosted runner (public repo).
# - app builds and tests C++ with g++ on Linux; app-windows does the same with MSVC.
# - Every job has timeout-minutes (the agent token cannot cancel runs).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.classify.outputs.app }}
      app-windows: ${{ steps.classify.outputs.app-windows }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        run: python3 scripts/ci_changes.py
      - name: Forbidden files (another program's files, binaries, keys)
        run: python3 scripts/check_forbidden_files.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gitleaks.outputs.app != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HEAVY_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  app-windows:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gitleaks.outputs.app-windows != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  python:
    needs: gitleaks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.gitleaks.outputs.python != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HEAVY_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Script tests
        run: python -m unittest discover -s scripts -v
      - name: Bridge tests
        run: python -m unittest discover -s bridge -v
